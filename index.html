<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Archivo+Black&display=swap" rel="stylesheet">

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Amey's Portfolio" />

    <!-- GTM_HEAD_PLACEHOLDER -->
    <title>Amey's Portfolio</title>
    <script>
      try {
        var saved = localStorage.getItem('amey.theme');
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        var accent = localStorage.getItem('amey.accent');
        if (accent) document.documentElement.setAttribute('data-accent', accent);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- GTM_BODY_PLACEHOLDER -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
