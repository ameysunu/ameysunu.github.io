name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Inject GTM tags (multiline-safe)
        run: |
          set -euo pipefail

          # Pick secrets per branch
          if [ "${GITHUB_REF##*/}" = "master" ]; then
            printf '%s' '${{ secrets.GTM_HEAD_STG_PRD }}' > /tmp/gtm_head.html
            printf '%s' '${{ secrets.GTM_BODY_STG_PRD }}' > /tmp/gtm_body.html
          else
            printf '%s' '${{ secrets.GTM_HEAD_DEV }}' > /tmp/gtm_head.html
            printf '%s' '${{ secrets.GTM_BODY_DEV }}' > /tmp/gtm_body.html
          fi

          HTML=index.html

          awk -v HEADFILE=/tmp/gtm_head.html -v BODYFILE=/tmp/gtm_body.html '
            BEGIN{
              RS=ORS="";
              while ((getline l < HEADFILE) > 0) head=head l "\n"; close(HEADFILE);
              while ((getline l < BODYFILE) > 0) body=body l "\n"; close(BODYFILE);
            }
            { gsub("<!-- GTM_HEAD_PLACEHOLDER -->", head);
              gsub("<!-- GTM_BODY_PLACEHOLDER -->", body);
              print;
            }' "$HTML" > "$HTML.tmp"

          mv "$HTML.tmp" "$HTML"

      - name: Build Project
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel
      
      - name: Check if branch is master
        run: |
          if [ "${GITHUB_REF}" == "refs/heads/master" ]; then
            echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID }}" >> $GITHUB_ENV
          else
            echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_DEV_ID }}" >> $GITHUB_ENV
          fi

      - name: Deploy to Vercel Action
        uses: BetaHuhn/deploy-to-vercel-action@v1.10.0
        with:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
